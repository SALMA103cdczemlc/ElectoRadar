name = "electoradar-normalisation"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false

[[kv_namespaces]]
binding = "SEEN"
id = "__KV_SEEN_ID__"

[[queues.consumers]]
queue = "electoradar-posts"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 10

[observability]
enabled = true

